[package]
name = "ruler-app"
version = "2.1.0"
edition = "2021"

[dependencies]
# Keep ICU4X diagnostic output on the `log` facade instead of debug-build stderr.
icu_provider = { version = "2", default-features = false, features = ["logging"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
ruler-core = { path = "../ruler-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.16", default-features = false, features = [
    "compat-1-2",
    "std",
    "renderer-software",
    "unstable-fontique-08",
] }
tungstenite = "0.24"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
slint-build = "1.16"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
netstat2 = "0.11.2"
sysinfo = "0.38.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
